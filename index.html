<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Student counselling dockets for choices after Class 10 and Class 12, with self-scoring career interest and aptitude tests. Developed by Dr. H. S. Khalsa.">
<meta name="theme-color" content="#B3195A">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font:14px system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
<script>window.SCD_STANDALONE = true;</script>
<title>Student Counselling Docket</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Besley:wght@500;700&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: an app shell. Brand strip, five tabs (top rail on desktop, bottom bar on phone), one view at a time.
   Dockets read as a contents rail plus one section; the test is an OMR-style answer sheet. */
:root{
  --paper:#EEF1F6; --surface:#FFFFFF; --surface-2:#F4F6FA; --ink:#16213A; --ink-2:#4D5A75; --line:#D2D9E5;
  --accent:#B3195A; --accent-ink:#FFFFFF; --accent-soft:#FBE5EE;
  --blue:#2542A8; --blue-soft:#E5EAFA;
  --good:#1D7448; --good-soft:#DFF2E7; --warn:#8A5200; --warn-soft:#FBEED3; --mark:#FFE27A;
  --f-display:'Besley',Georgia,'Times New Roman',serif;
  --f-body:'Hanken Grotesk',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,'SFMono-Regular',Menlo,Consolas,monospace;
  --navh:0px; --r:10px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#0E1422; --surface:#172033; --surface-2:#1D2840; --ink:#E9EDF6; --ink-2:#A6B1C8; --line:#2E3B57;
  --accent:#F27AA5; --accent-ink:#2A0A17; --accent-soft:#3B1A29;
  --blue:#A9BCFF; --blue-soft:#1E2B52;
  --good:#6FD3A0; --good-soft:#143325; --warn:#F0BC5E; --warn-soft:#3A2C10; --mark:#6B5A12; color-scheme:dark } }
:root[data-theme="dark"]{
  --paper:#0E1422; --surface:#172033; --surface-2:#1D2840; --ink:#E9EDF6; --ink-2:#A6B1C8; --line:#2E3B57;
  --accent:#F27AA5; --accent-ink:#2A0A17; --accent-soft:#3B1A29;
  --blue:#A9BCFF; --blue-soft:#1E2B52;
  --good:#6FD3A0; --good-soft:#143325; --warn:#F0BC5E; --warn-soft:#3A2C10; --mark:#6B5A12; color-scheme:dark }

*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{background:var(--paper);color:var(--ink);font:400 16px/1.55 var(--f-body)}
h1,h2,h3,p,ul,ol,figure{margin:0}
ul,ol{padding:0;list-style:none}
a{color:var(--blue);text-underline-offset:2px}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}
mark{background:var(--mark);color:var(--ink);border-radius:2px;padding:0 1px}
.mono{font-family:var(--f-mono)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.shell{max-width:1180px;margin-inline:auto;padding-inline:16px}
@media (min-width:900px){ .shell{padding-inline:24px} :root{--navh:49px} }

/* brand */
.brand{display:flex;align-items:center;gap:12px;padding-block:14px 10px}
.brand svg{flex:none;color:var(--accent)}
.brand b{display:block;font:700 1.12rem/1.2 var(--f-display);letter-spacing:-.01em}
.brand small{display:block;font:500 .68rem/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.brand a{color:inherit;text-decoration:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs ul{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));max-width:1180px;margin-inline:auto}
.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 7px;color:var(--ink-2);text-decoration:none;font:600 .68rem/1.2 var(--f-body)}
.tabs a svg{width:22px;height:22px}
.tabs a[aria-current="page"]{color:var(--accent)}
.tabs .lg{display:none}
main{padding-block:8px calc(84px + env(safe-area-inset-bottom,0px));min-height:60vh}
@media (min-width:900px){
  .tabs{position:sticky;top:env(safe-area-inset-top,0px);bottom:auto;background:var(--paper);border-top:0;border-bottom:1px solid var(--line);padding-bottom:0}
  .tabs ul{display:flex;gap:4px;padding-inline:24px}
  .tabs a{flex-direction:row;gap:8px;padding:13px 14px 12px;font-size:.92rem;border-bottom:3px solid transparent;margin-bottom:-1px}
  .tabs a svg{width:18px;height:18px}
  .tabs a[aria-current="page"]{color:var(--ink);border-bottom-color:var(--accent)}
  .tabs .sm{display:none} .tabs .lg{display:inline}
  main{padding-block:28px 64px}
}

/* type */
h1{font:700 clamp(1.55rem,1.1rem + 2vw,2.3rem)/1.15 var(--f-display);letter-spacing:-.015em;text-wrap:balance}
h1:focus{outline:none}
h2{font:700 1.2rem/1.25 var(--f-display);text-wrap:balance}
h3{font:700 1.08rem/1.3 var(--f-display);text-wrap:balance}
.eyebrow{font:500 .72rem/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.lead{font-size:1.08rem;color:var(--ink-2);max-width:62ch}
.muted{color:var(--ink-2)}
.small{font-size:.86rem}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:9px 18px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;text-decoration:none;color:var(--ink)}
.btn:hover{border-color:var(--ink-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--blue);padding-inline:10px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.col{display:flex;flex-direction:column;gap:14px;min-width:0}
.col.lg{gap:28px}

/* docket folder card */
.folder{position:relative;margin-top:27px;background:var(--surface);border:1px solid var(--line);border-radius:0 var(--r) var(--r) var(--r);padding:18px 18px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.folder .tabx{position:absolute;left:-1px;top:-27px;height:27px;padding:0 12px;display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:8px 8px 0 0;font:500 .68rem/1 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.folder.test .tabx{color:var(--accent)}
a.folder{text-decoration:none;color:inherit}
a.folder:hover{border-color:var(--ink-2)}
a.folder:hover .tabx{border-color:var(--ink-2)}
.folder h2{font-size:1.25rem}
.folder .go{margin-top:auto;font-weight:600;color:var(--blue)}
.folder.test .go{color:var(--accent)}
.cards3{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.two{display:grid;gap:28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.pill{display:inline-flex;align-items:center;gap:6px;padding:2px 10px;border-radius:999px;font:500 .72rem/1.6 var(--f-mono);background:var(--surface-2);color:var(--ink-2);border:1px solid var(--line);white-space:nowrap;align-self:flex-start}
.pill.hot{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.pill.ok{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}

/* lists on home */
.rows{border-top:1px solid var(--line)}
.rows li{border-bottom:1px solid var(--line)}
.rows a,.rows .rw{display:grid;grid-template-columns:5.6rem minmax(0,1fr) auto;gap:12px;align-items:baseline;padding:11px 2px;text-decoration:none;color:inherit}
.rows a:hover .ttl{text-decoration:underline}
.rows .dt{font:500 .78rem/1.5 var(--f-mono);color:var(--ink-2);font-variant-numeric:tabular-nums}
.rows .ttl{font-weight:600}
.rows .sub{display:block;font-weight:400;font-size:.86rem;color:var(--ink-2)}
.jump a{grid-template-columns:2.4rem minmax(0,1fr) auto}
.note{border-left:3px solid var(--line);padding:2px 0 2px 14px;color:var(--ink-2);font-size:.9rem;max-width:72ch}
.callout{background:var(--blue-soft);border-radius:var(--r);padding:14px 16px;display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
.callout.warn{background:var(--warn-soft)} .callout.accent{background:var(--accent-soft)} .callout.good{background:var(--good-soft)}
.callout p{max-width:60ch}

/* docket */
.dk{display:grid;gap:32px;grid-template-columns:minmax(0,1fr)}
.rail{display:none}
.chapbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.chapbar select{flex:1 1 220px;min-width:0;min-height:44px;padding:8px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface)}
@media (min-width:900px){
  .dk{grid-template-columns:250px minmax(0,1fr)}
  .rail{display:block;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh) + 20px);align-self:start;max-height:calc(100vh - var(--navh) - 40px);overflow:auto;padding-right:4px}
  .chapbar{display:none}
}
.rail .rh{display:block;font:700 1rem/1.3 var(--f-display);color:var(--ink);text-decoration:none;padding-bottom:10px;border-bottom:1px solid var(--line);margin-bottom:6px}
.rail li a{display:grid;grid-template-columns:1.9rem minmax(0,1fr);gap:4px;padding:6px 8px;border-radius:7px;color:var(--ink-2);text-decoration:none;font-size:.9rem;line-height:1.35}
.rail li a .n{font:500 .74rem/1.7 var(--f-mono)}
.rail li a:hover{color:var(--ink);background:var(--surface-2)}
.rail li a[aria-current="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:inset 3px 0 0 var(--accent)}
.chap{display:flex;flex-direction:column;gap:16px;min-width:0}
.chap>p,.chap>ul,.chap>ol{max-width:72ch}
.chap h3{margin-top:14px}
ul.b li,ol.b li{position:relative;padding-left:1.5rem;margin-block:.4rem}
ul.b li::before{content:"";position:absolute;left:.35rem;top:.62em;width:6px;height:6px;border-radius:50%;background:var(--accent)}
ol.b{counter-reset:o}
ol.b li{counter-increment:o;padding-left:2rem}
ol.b li::before{content:counter(o);position:absolute;left:0;top:.1em;font:500 .8rem/1.7 var(--f-mono);color:var(--accent)}
.chk li{margin-block:.3rem}
.chk label{display:grid;grid-template-columns:auto minmax(0,1fr);gap:10px;align-items:start;padding:6px 8px;border-radius:8px;cursor:pointer}
.chk label:hover{background:var(--surface-2)}
.chk input{width:20px;height:20px;margin:2px 0 0;accent-color:var(--accent)}
.chk input:checked + span{color:var(--ink-2);text-decoration:line-through}
.pn{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:12px;margin-top:20px}
.pn a{display:block;padding:12px 14px;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);text-decoration:none;color:var(--ink)}
.pn a:hover{border-color:var(--ink-2)}
.pn a small{display:block;font:500 .68rem/1.5 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2)}
.pn a.nx{text-align:right}
.seclist{display:grid;gap:0 28px;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));border-top:1px solid var(--line)}
.seclist a{display:grid;grid-template-columns:2.3rem minmax(0,1fr);gap:6px;padding:12px 2px;border-bottom:1px solid var(--line);color:var(--ink);text-decoration:none;font-weight:600}
.seclist a:hover span:last-child{text-decoration:underline}
.seclist .n,.jump .n{font:500 .8rem/1.9 var(--f-mono);color:var(--accent)}
.flash{animation:fl 2.2s ease-out}
@keyframes fl{0%,35%{background:var(--mark)}100%{background:transparent}}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);max-width:100%}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;line-height:1.45}
.t th,.t td{padding:.62rem .75rem;text-align:left;vertical-align:top;border-top:1px solid var(--line)}
.t thead th{border-top:0;background:var(--surface-2);font:500 .7rem/1.35 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
.t tbody th{font-weight:600}
.t.n2 tbody th{width:38%}
.t textarea{display:block;width:100%;min-width:7rem;min-height:38px;resize:none;overflow:hidden;padding:7px 9px;border:1px dashed var(--ink-2);border-radius:6px;background:var(--surface-2);line-height:1.4}
.t textarea:focus{border-style:solid;border-color:var(--blue);outline:none;background:var(--surface)}
.yn{display:inline-block;padding:1px 9px;border-radius:999px;font:500 .74rem/1.6 var(--f-mono)}
.yn.y{background:var(--good-soft);color:var(--good)} .yn.n{background:var(--surface-2);color:var(--ink-2)}
@media (min-width:761px){ .t.n5{min-width:700px} .t.n6{min-width:820px} .t.n7{min-width:920px} .t.n9{min-width:1100px} }
@media (max-width:760px){
  .t.stack thead{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .t.stack,.t.stack tbody,.t.stack tr,.t.stack th{display:block}
  .t.stack tr{padding:12px 12px 10px;border-top:1px solid var(--line)}
  .t.stack tr:first-child{border-top:0}
  .t.stack tbody th{padding:0 0 4px;border:0;font-size:1rem}
  .t.stack td{display:grid;grid-template-columns:6.6rem minmax(0,1fr);gap:10px;border:0;padding:4px 0;align-items:start}
  .t.stack td::before{content:attr(data-l);font:500 .66rem/1.7 var(--f-mono);letter-spacing:.05em;text-transform:uppercase;color:var(--ink-2)}
  .t.stack td.empty{display:none}
  .t.n2 tbody th{width:45%}
}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-height:36px;padding:5px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-weight:600;font-size:.88rem}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

/* route maps */
.map{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:14px}
.map .root{align-self:flex-start;background:var(--ink);color:var(--paper);padding:5px 14px;border-radius:999px;font:500 .76rem/1.6 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.band{border-left:3px solid var(--line);padding-left:14px;display:flex;flex-direction:column;gap:8px}
.band.a{border-color:var(--accent)} .band.b{border-color:var(--blue)}
.band>b{font:500 .7rem/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--ink-2)}
.tiles{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.tile{display:block;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface-2);text-decoration:none;color:var(--ink);min-width:0}
.tile:hover{border-color:var(--ink-2)}
.tile strong{display:block;line-height:1.3}
.tile span.pill{display:inline-flex}
.tile span:not(.pill){display:block;font-size:.84rem;color:var(--ink-2);line-height:1.4;margin-top:2px}

/* search */
.sbox{display:flex;gap:8px}
.sbox input{flex:1;min-width:0;min-height:48px;padding:10px 16px;border-radius:999px;border:1px solid var(--line);background:var(--surface)}
.sgroup{display:flex;flex-direction:column;gap:2px}
.sgroup h2{font:600 .95rem/1.4 var(--f-body);padding-top:8px}
.sgroup h2 span{font:500 .7rem/1.4 var(--f-mono);letter-spacing:.07em;text-transform:uppercase;color:var(--accent);margin-right:8px}
.hit{display:block;padding:9px 12px;border-radius:8px;text-decoration:none;color:var(--ink);background:var(--surface);border:1px solid var(--line);font-size:.92rem}
.hit:hover{border-color:var(--ink-2)}
.hit b{display:block}

/* test */
.steps{display:flex;gap:6px;flex-wrap:wrap;font:500 .7rem/1 var(--f-mono);letter-spacing:.06em;text-transform:uppercase}
.steps li button,.steps li span{display:block;padding:7px 11px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--ink-2);font:inherit;letter-spacing:inherit;text-transform:inherit}
.steps li[aria-current="step"]>*{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.steps li.done>*{color:var(--good);border-color:var(--good)}
.tbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--navh));z-index:10;background:var(--paper);padding-block:10px 0;margin-inline:-4px;padding-inline:4px}
.tbar-in{display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline;padding-bottom:8px}
.tbar-in strong{font:700 1.05rem/1.2 var(--f-display)}
.tbar-in .count{margin-left:auto;font:500 .82rem/1.4 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2)}
.timer{font:500 .92rem/1.4 var(--f-mono);font-variant-numeric:tabular-nums;background:var(--accent-soft);color:var(--accent);padding:1px 10px;border-radius:999px}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.prog i{display:block;height:100%;background:var(--accent);border-radius:0 2px 2px 0;transition:width .2s}
.live{display:flex;flex-wrap:wrap;gap:6px 14px;font:500 .78rem/1.5 var(--f-mono);font-variant-numeric:tabular-nums;color:var(--ink-2);padding-top:8px}
.live b{color:var(--ink);font-weight:500}
.sheet{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.q{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:12px 14px;border-top:1px solid var(--line)}
.q:first-child{border-top:0}
.q.miss{background:var(--warn-soft)}
.qt{display:grid;grid-template-columns:2rem minmax(0,1fr);gap:6px;align-items:baseline}
.qn{font:500 .8rem/1.6 var(--f-mono);color:var(--accent);font-variant-numeric:tabular-nums}
.seg{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.seg input,.omr input,.yrs input{position:absolute;opacity:0;width:1px;height:1px}
.seg label,.yrs label{display:flex;align-items:center;justify-content:center;min-height:40px;padding:6px 8px;border:1px solid var(--line);border-radius:8px;font-weight:600;font-size:.88rem;text-align:center;cursor:pointer;background:var(--surface)}
.seg input:checked + label,.yrs input:checked + label{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.seg input:focus-visible + label,.omr input:focus-visible + label,.yrs input:focus-visible + label{outline:2px solid var(--blue);outline-offset:2px}
.seg input:disabled + label,.omr input:disabled + label{opacity:.6;cursor:not-allowed}
@media (min-width:680px){ .q.ab{grid-template-columns:minmax(0,1fr) 17.5rem;align-items:center} }
.dense .q{padding:8px 12px} .dense .seg label{min-height:34px;font-size:.8rem}
@media (min-width:980px){ .dense.cols{display:grid;grid-template-columns:1fr 1fr} .dense.cols .q:nth-child(2){border-top:0} .dense.cols .q:nth-child(odd){border-right:1px solid var(--line)} .dense.cols .q.ab{grid-template-columns:minmax(0,1fr) 13.5rem} }
.omr{display:grid;gap:6px;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));padding-left:2rem}
.omr label{display:flex;gap:10px;align-items:center;min-height:42px;padding:5px 10px 5px 6px;border:1px solid var(--line);border-radius:999px;cursor:pointer;background:var(--surface)}
.bub{flex:none;width:28px;height:28px;border-radius:50%;border:1.5px solid var(--accent);color:var(--accent);display:grid;place-items:center;font:500 .8rem/1 var(--f-mono)}
.omr input:checked + label{border-color:var(--accent);background:var(--accent-soft)}
.omr input:checked + label .bub{background:var(--accent);color:var(--accent-ink)}
.area{font:500 .72rem/1.4 var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--ink-2);padding:12px 14px 0}
.tnav{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;align-items:center}
.fields{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,250px),1fr))}

## 1. How to use this docket

Choose Class 11 subjects by working backwards from the careers you want to keep open, not from marks or peer choices alone. This docket is written for Class 10 students in India, their parents and the school counsellor, and is meant to be filled in over two or three counselling sittings.

1. **Know yourself.** Complete the self-assessment in Section 2 before reading about any stream.
1. **See the map.** Section 3 shows every route open after Class 10 on one page.
1. **Study two streams in depth.** Sections 4 to 9 list, for each subject group, the careers it leads to, the leading institutions, the entrance exams and the outlook.
1. **Test the choice against the future.** Sections 10 and 11 separate traditional from new-age careers and show which are favoured, reshaped or put at risk by artificial intelligence.
1. **Plan and record.** Section 12 gives the exam table and timeline; Section 15 is the counsellor's record and action plan.

Three principles guide the counselling:

- **Interest sustains effort, aptitude decides speed, values decide satisfaction.** A good choice satisfies all three.
- **Subjects close doors more often than they open them.** Dropping Mathematics or Biology removes specific careers; adding them rarely removes any.
- **No stream is superior.** Each has high-earning and low-earning careers; the fit matters more than the label.

## 2. Know yourself first

A stream fits when your interests, your strongest abilities and your working style point the same way. Fill in the three worksheets honestly and alone, then discuss them with your counsellor.

### 2.1 Interest profile

Rate each statement from 1 (not me) to 5 (very much me). Your two highest types suggest the streams in the last column.

@form
| Interest type | I enjoy... | My rating (1 to 5) | Streams that usually fit
| Realistic (doer) | building, repairing, machines, outdoor and hands-on work | | PCM, diploma and ITI, defence, agriculture
| Investigative (thinker) | experiments, puzzles, asking why, data and research | | PCM, PCB, economics, psychology
| Artistic (creator) | drawing, writing, music, designing, original ideas | | Humanities, design, architecture, media
| Social (helper) | teaching, caring, listening, working with people | | PCB, humanities, education, social work
| Enterprising (persuader) | leading, selling, debating, starting things | | Commerce, law, management, politics
| Conventional (organiser) | accounts, records, order, rules and accuracy | | Commerce, banking, administration

### 2.2 Aptitude check

Rate yourself, then ask one teacher and one parent to rate you. Large gaps between the three ratings are worth discussing.

@form
| Ability | Evidence to look for | Self | Teacher | Parent
| Numerical | Maths marks, mental arithmetic, comfort with formulas | | | |
| Verbal | Reading speed, essay writing, debating, vocabulary | | | |
| Logical reasoning | Puzzles, coding, chess, spotting patterns | | | |
| Spatial and visual | Drawing, geometry, maps, 3D imagination | | | |
| Scientific | Curiosity about how things work, lab work | | | |
| Memory and detail | Biology diagrams, dates, accuracy in long tasks | | | |
| Interpersonal | Teamwork, empathy, leadership, persuasion | | | |
| Creative | Original ideas, stories, design, music | | | |

### 2.3 Reflection questions

- Which two subjects do I study without being told to?
- Which subject do I avoid, and is it the subject or the way it was taught?
- What do people ask me for help with?
- Would I rather work with people, ideas, data or things?
- How many years of study after Class 12 am I and my family prepared for?
- Which matters most to me: income, stability, creativity, service or independence?

A formal psychometric test administered by a trained counsellor is recommended before the final decision. Treat any test as one input, alongside marks over three years and the student's own stated interest.

## 3. Pathways after Class 10 at a glance

A Class 10 student has four routes: senior secondary school (Classes 11 and 12) in one of three streams, a three-year polytechnic diploma, a one or two-year ITI trade, or open and vocational schooling. Most career options in this docket begin with Classes 11 and 12.

@routes10

Science, commerce and humanities all run through Classes 11 and 12; the diploma, ITI and open-schooling routes branch off directly after Class 10.

### 3.1 The routes compared

| Route | Core subjects | Duration | Careers it keeps open | What it closes
| Science with Maths (PCM) | Physics, Chemistry, Mathematics, English + 1 elective | 2 years | Engineering, architecture, pure sciences, data and AI, defence, aviation, plus every commerce and humanities career | Medicine and most allied health courses
| Science with Biology (PCB) | Physics, Chemistry, Biology, English + 1 elective | 2 years | Medicine, dentistry, AYUSH, nursing, pharmacy, life sciences, agriculture, plus humanities careers | Engineering, architecture, most quantitative degrees
| Science with both (PCMB) | Physics, Chemistry, Mathematics, Biology, English | 2 years | Every science career | Nothing, but the workload is the heaviest
| Commerce | Accountancy, Business Studies, Economics, English + Maths or Applied Maths or another elective | 2 years | CA, CS, CMA, finance, banking, management, economics, law | Science, engineering and medical careers
| Humanities | Any of History, Political Science, Geography, Economics, Psychology, Sociology, Languages, Fine Arts, Legal Studies | 2 years | Law, civil services, design, media, psychology, teaching, social sector, liberal arts | Science, engineering, medical; some commerce degrees need Maths
| Polytechnic diploma | Engineering branch of choice | 3 years | Junior engineer posts, lateral entry to second-year B.Tech | Medicine; slower route to top institutes
| ITI trade | Electrician, fitter, welder, COPA and 100+ other trades | 1 to 2 years | Skilled employment, apprenticeship, self-employment | Direct entry to degree courses without further study

### 3.2 Subject decisions that matter most

- **Mathematics in Class 11** is compulsory for B.Tech, B.Arch, NDA (Air Force and Navy), commercial pilot training, statistics, actuarial science and most data science degrees. Several universities, including Delhi University, also require it for B.A. (Hons) Economics.
- **Biology in Class 11** is compulsory for NEET, which is the single gateway to MBBS, BDS, AYUSH and veterinary seats.
- **Applied Mathematics** suits commerce and humanities students. It is not accepted in place of Mathematics for engineering.
- **CBSE Mathematics Basic in Class 10:** the standing rule allows only Applied Mathematics in Class 11. CBSE has relaxed this year by year, letting principals permit Mathematics (041) if the student shows aptitude. Check the current circular before choosing Basic.
- **The fifth or sixth subject is a strategic choice.** Computer Science, Informatics Practices, Artificial Intelligence, Economics, Psychology, Legal Studies, Physical Education and Fine Arts each open a second line of careers.
- **Under CUET, a student may sit any subject paper regardless of Class 12 subjects**, but each university still sets its own eligibility for each course.

### 3.3 Boards for Classes 11 and 12

| Board | Character | Suits students who
| CBSE | NCERT-based; aligned with JEE, NEET and CUET | Plan to sit national entrance exams
| CISCE (ISC) | Detailed syllabus, strong English and project work | Want depth, language strength and liberal arts
| State boards | State syllabus; advantage in state quota seats | Target state engineering, medical and university seats
| IB Diploma | Six subjects, extended essay, inquiry-based | Plan to study abroad or at liberal arts universities
| Cambridge A Levels | Three or four subjects in depth | Want specialisation and overseas admission
| NIOS | Open schooling with flexible subjects and pace | Athletes, performers, or students needing flexibility

## 4. Science with Mathematics (PCM)

PCM is the widest stream: it leads to engineering, technology, architecture, the physical sciences, defence and aviation, and leaves every commerce and humanities career open. It suits students with strong numerical and logical ability who enjoy problem-solving more than memorising.

### 4.1 Career map

| Career field | Typical roles | Course and duration | Entrance route | Leading institutions | Outlook
| Engineering (core branches) | Mechanical, civil, electrical, chemical, aerospace engineer | B.Tech / B.E., 4 years | JEE Main, JEE Advanced, BITSAT, state CETs | IIT Madras, Delhi, Bombay, Kanpur, Kharagpur, Roorkee; NIT Tiruchirappalli; BITS Pilani | Steady. Demand rising in infrastructure, semiconductors, electric vehicles and renewable energy
| Computer science and IT | Software engineer, systems architect, cloud and cybersecurity engineer | B.Tech CSE, 4 years; BCA, 3 to 4 years | JEE Main, JEE Advanced, BITSAT, UGEE, CUET | IITs, IIIT Hyderabad, IIIT Bangalore, NITs, BITS Pilani, DTU, NSUT | Strong for skilled graduates; routine entry-level coding is being automated
| Artificial intelligence and data science | Machine learning engineer, data scientist, AI researcher | B.Tech AI and DS; B.S. Data Science; B.Stat, 3 to 4 years | JEE, ISI Admission Test, CMI entrance, IIT Madras BS qualifier | IIT Hyderabad, IIT Madras, IISc, ISI Kolkata, CMI Chennai | Very strong; among the fastest-growing roles worldwide
| Electronics and semiconductors | VLSI design engineer, embedded systems engineer, chip verification | B.Tech ECE or VLSI, 4 years | JEE Main, JEE Advanced, state CETs | IITs, NITs, IIITs, BITS Pilani | Strong; supported by India Semiconductor Mission investments
| Architecture and planning | Architect, urban planner, landscape architect | B.Arch, 5 years; B.Plan, 4 years | NATA, JEE Main Paper 2A and 2B, AAT for IITs | IIT Roorkee, IIT Kharagpur, NIT Calicut, SPA Delhi, CEPT Ahmedabad | Moderate; best for those who add sustainability and digital modelling skills
| Pure sciences and research | Physicist, chemist, materials scientist, research scientist | BS-MS, 5 years; B.Sc. (Hons), 3 to 4 years | IAT, NEST, JEE Advanced, CUET | IISc Bengaluru, IISERs, NISER Bhubaneswar, Delhi University colleges | Long training; rewarding in research, deep-tech and academia
| Mathematics, statistics, actuarial science | Statistician, quantitative analyst, actuary | B.Stat, B.Math, B.Sc. Statistics, 3 to 4 years; actuarial papers alongside | ISI Admission Test, CMI entrance, CUET, ACET | ISI Kolkata and Bengaluru, CMI, Delhi University | Very strong in finance, insurance, analytics and AI
| Space and aerospace | Space scientist, avionics engineer, satellite systems engineer | B.Tech Aerospace or Avionics, 4 years | JEE Advanced (IIST), JEE Main | IIST Thiruvananthapuram, IIT Bombay, IIT Madras, IIT Kanpur | Growing with private space companies and ISRO programmes
| Defence services (technical and flying) | Army, Navy and Air Force officer | NDA, 3 years + academy training; 10+2 Technical Entry | NDA and NA exam + SSB; JEE Main rank for technical entries | National Defence Academy, Indian Naval Academy, Air Force Academy | Stable, respected, pensionable career
| Merchant navy | Deck officer, marine engineer | B.Sc. Nautical Science, 3 years; B.Tech Marine Engineering, 4 years | IMU CET | Indian Maritime University campuses, T.S. Chanakya, MERI | High early income; long periods at sea
| Aviation | Commercial pilot, air traffic controller, aircraft maintenance engineer | CPL training, 18 to 24 months; AME, 2 to 4 years | Flying school tests, DGCA exams and Class 1 medical | IGRUA Amethi, DGCA-approved flying schools | Strong; Indian airlines have large aircraft orders, but training is costly
| Robotics, EV and renewable energy | Robotics engineer, battery engineer, solar and wind engineer | B.Tech in mechatronics, energy or electrical, 4 years | JEE Main, state CETs | IITs, NITs, state technical universities | Strong; listed among the fastest-growing roles to 2030

Leading institutions follow the [NIRF India Rankings 2025](https://www.nirfindia.org/Rankings/2025/EngineeringRanking.html), the latest edition published at the time of writing.

### 4.2 Entrance exams in detail

| Exam | Conducted by | Admission to | Pattern | When | Key rules
| JEE Main (Paper 1) | National Testing Agency (NTA) | NITs, IIITs, GFTIs, many state and private colleges; qualifier for JEE Advanced | Computer-based; 75 questions (25 each in Physics, Chemistry, Maths); 300 marks; 3 hours; +4 / -1 | Two sessions: January and April of Class 12 | Best score of the two sessions counts; three consecutive years of attempts
| JEE Advanced | An IIT, by rotation | 23 IITs, IIST, IISc and IISERs (some seats) | Computer-based; two compulsory papers of 3 hours each; pattern varies yearly | May or June, after JEE Main | Only top JEE Main rankers (about 2.5 lakh) qualify; two attempts in consecutive years; 75% in Class 12 or top 20 percentile
| BITSAT | BITS Pilani | BITS Pilani, Goa, Hyderabad campuses | Computer-based; 130 questions; 3 hours; includes English and logical reasoning | Two sessions: May and June | 75% aggregate in PCM in Class 12

### 4.3 Future prospects

Engineering remains India's largest professional pathway, but the reward now depends on branch, institute and skills more than on the degree alone. The safest PCM choices combine a core discipline with computing, data and AI skills. Students who dislike sustained mathematics should not choose PCM only for its prestige; the two-year entrance preparation is demanding.

## 5. Science with Biology (PCB)

PCB leads to medicine and the far larger family of health, life science and agriculture careers around it. It suits students with curiosity about living systems, patience for detail and a wish to work with people or in laboratories. Fewer than one in ten NEET candidates secures an MBBS seat, so every PCB student should plan a second and third option from this chapter.

### 5.1 Career map

| Career field | Typical roles | Course and duration | Entrance route | Leading institutions | Outlook
| Medicine | Physician, surgeon, specialist | MBBS, 5.5 years including internship; MD / MS, 3 more years | NEET UG | AIIMS New Delhi, CMC Vellore, JIPMER Puducherry, IMS-BHU, KGMU Lucknow, KMC Manipal, MAMC Delhi, AFMC Pune | Very strong and stable; long and costly training
| Dentistry | Dental surgeon, orthodontist | BDS, 5 years | NEET UG | Maulana Azad Institute of Dental Sciences, Manipal College of Dental Sciences, Saveetha, government dental colleges | Moderate; best with a postgraduate specialisation
| AYUSH systems | Ayurveda, homoeopathy, Unani, Siddha practitioner | BAMS, BHMS, BUMS, BSMS, 5.5 years | NEET UG | AIIA New Delhi, NIA Jaipur, ITRA Jamnagar, IMS-BHU | Growing with wellness and integrative medicine
| Veterinary science | Veterinarian, livestock and wildlife specialist | B.V.Sc. and A.H., 5.5 years | NEET UG (all-India quota) and state tests | IVRI Bareilly, GADVASU Ludhiana, TANUVAS Chennai, LUVAS Hisar | Strong; shortage of vets, growth in pet care and dairy
| Nursing | Staff nurse, nurse practitioner, military nursing officer | B.Sc. Nursing, 4 years | AIIMS nursing test, NEET for some institutes, state tests | AIIMS, CMC Vellore, RAK College of Nursing, PGIMER Chandigarh | Very strong in India and overseas

| Biotechnology and genetics | Biotechnologist, genetic counsellor, bioprocess scientist | B.Sc. or B.Tech Biotechnology, 3 to 4 years | CUET, IAT, state CETs, institute tests | IISERs, IISc, Delhi University, VIT, Anna University | Strong in vaccines, biopharma and genomics; needs a master's
| Life science research | Research scientist, ecologist, neuroscientist | BS-MS, 5 years; B.Sc. (Hons), 3 to 4 years | IAT, NEST, CUET | IISc, IISERs, NISER, Delhi University colleges | Long training; fellowships available throughout

Medical institutions follow the [NIRF India Rankings 2025, Medical](https://www.nirfindia.org/Rankings/2025/MedicalRanking.html); only those that admit undergraduates are listed.

### 5.2 Entrance exams in detail

| Exam | Conducted by | Admission to | Pattern | When | Key rules
| NEET UG | NTA | MBBS, BDS, AYUSH, veterinary and some nursing seats in every college in India | 180 compulsory questions (Physics 45, Chemistry 45, Biology 90); 720 marks; +4 / -1 | Once a year, in May | Moves from pen-and-paper to computer-based mode from 2027; minimum age 17; 50% in PCB for general category
| AIIMS B.Sc. (Hons) Nursing | AIIMS New Delhi | Nursing at all AIIMS | Computer-based MCQs in Physics, Chemistry, Biology and general knowledge | June | Separate from NEET

### 5.3 Future prospects

Health care is among the sectors least threatened by automation because it depends on physical care, trust and judgement. India has a shortage of nurses, allied health professionals and veterinarians, and these courses offer faster and cheaper entry than MBBS. Students who take Mathematics as a fifth subject (PCMB) keep biotechnology engineering, bioinformatics and data careers fully open.

## 6. Commerce

Commerce leads to the professions of money and business: accounting, finance, banking, economics, management and entrepreneurship. It suits students who are comfortable with numbers, follow business news and like organised, rule-based work. Taking Mathematics or Applied Mathematics is strongly advised; it is required or tested in economics, actuarial science, analytics and every management aptitude test.

### 6.1 Career map

| Career field | Typical roles | Course and duration | Entrance route | Leading institutions | Outlook

### 6.3 Future prospects

Commerce careers are splitting in two. Recording and checking work (data entry, basic bookkeeping, bank teller and clerical roles) is declining fastest under automation. Judgement work (audit, tax strategy, risk, valuation, financial advice, analytics) is growing. A commerce student should aim for one professional qualification plus working fluency in spreadsheets, data tools and AI.

## 7. Humanities and Arts

Humanities builds the skills that are hardest to automate: reading people and societies, arguing a case, writing clearly and judging right from wrong. It leads to law, civil services, psychology, media, design, teaching, policy and the social sector. It suits students who read widely, write well and are curious about people; it is a first-choice stream, not a fallback.

### How to weigh the two

| Consideration | Traditional careers | New-age careers
| Entry route | Fixed degree, licence or national exam | Degree plus portfolio, projects and certifications
| Stability | High; clear seniority ladder | Variable; roles change every few years
| Growth | Steady | Faster, with higher risk

| What protects you | The qualification | Continuous learning and demonstrable work

The strongest plan pairs the two: a recognised degree for security, and a new-age specialisation built through electives, internships and projects from the first year of college.

## 11. Careers and artificial intelligence

AI is changing tasks faster than it is removing whole professions, so the right question is which parts of a career AI will do. The World Economic Forum's [Future of Jobs Report 2025](https://www.weforum.org/publications/the-future-of-jobs-report-2025/digest/) projects 170 million jobs created and 92 million displaced worldwide by 2030, a net gain of 78 million. For India's technology services sector, [NITI Aayog](https://niti.gov.in/sites/default/files/2025-10/Roadmap_for_Job_Creation_in_the_AI_Economy.pdf) estimates a range from 1.5 million jobs lost to 4 million created by 2031, depending on how quickly people reskill.

A simple test for any role: work is **exposed** when it is routine, screen-based and rule-governed. Work is **protected** when it needs physical skill, human trust, legal accountability or original judgement.

| AI ethics, policy and technology law specialist | Governments and companies must regulate and audit AI | Humanities, Law
| UX and product designer | Every AI product needs a human-centred interface | Any stream
| AI trainer, prompt and workflow designer, AI operations specialist | New roles that adapt AI to each business function | Any stream

No course in this docket trains only for an at-risk role. The risk arises when a graduate stops at the entry-level task and does not build judgement, domain depth or technical fluency.

### 11.5 Skills that protect a career in the AI age

- **AI and data fluency:** using AI tools well, checking their output, and understanding data.
- **Analytical and creative thinking:** defining the problem and imagining solutions AI was not asked for.
- **Communication and social influence:** explaining, persuading, leading and caring.
- **Resilience and lifelong learning:** employers expect about two-fifths of core job skills to change by 2030.
- **Domain depth:** AI amplifies an expert and exposes a beginner.

### 11.6 What a Class 10 student should do now

1. Keep Mathematics for as long as you reasonably can; it underlies every AI-favoured career.
1. Learn one programming language and basic data handling by Class 12, whatever the stream.
1. Use AI as a tutor and assistant, never as a substitute for your own thinking and writing.
1. Build one visible human skill: debating, writing, sport, performance, leadership or volunteering.
1. Judge a career by its daily tasks. Ask a working professional which tasks AI already does for them.

These are projections, not certainties. Review this section each year against the latest reports.

### 13.3 Studying abroad after Class 12

An undergraduate degree abroad needs planning from Class 11 and a budget of roughly Rs 20 lakh to Rs 60 lakh a year unless a scholarship is won.

- **Tests:** SAT or ACT for the United States; IELTS, TOEFL or Duolingo for English; subject tests such as UCAT for UK medicine.
- **Timeline:** shortlist by the end of Class 11; applications run from August to January of Class 12; UK early deadline is mid-October.
- **Profile:** consistent marks from Class 9 onward, essays, recommendation letters and sustained activities matter as much as test scores.
- **Subjects:** UK and European universities ask for specific Class 12 subjects; Germany generally needs a foundation year or a year of Indian university study.
- **Caution:** visa and post-study work rules in the US, UK, Canada and Australia have tightened and change often. Check current rules before committing.

## 14. Myths and facts for students and parents

| Myth | Fact
| Science is for toppers, commerce for average students, humanities for the rest | Each stream has its own difficulty and its own top careers. Law, design, economics and civil services are as competitive as engineering.
| Taking science keeps every option open | PCM keeps the most options open, but a student who dislikes it risks poor marks and two unhappy years. A strong result in the right stream beats a weak result in the widest one.
| A high score in Class 10 Science means the student should take science | Marks show past performance. Interest and aptitude predict whether the student will sustain Class 11 and 12, which are far harder.
| Engineering and medicine are the only secure careers | Nursing, allied health, chartered accountancy, law, design, data science and skilled trades all show strong demand.
| AI will take all the jobs, so the choice does not matter | AI removes routine tasks and raises the value of judgement, creativity and human skill. The choice matters more, not less.
| Coaching from Class 9 is essential | Strong school fundamentals and self-study come first. Coaching helps some students for some exams; it is not a substitute for interest.
| Friends and cousins chose it, so it must be right | Every student's interest profile differs. A choice copied from others often ends in a stream change in Class 11.
| A wrong choice now cannot be corrected | Stream change is possible early in Class 11, CUET lets students cross subjects, and many careers in Section 8 admit any stream.

### 7.3 Planning for the civil services

The UPSC Civil Services Examination needs only a degree in any subject and a minimum age of 21, so the undergraduate course is free to be chosen for interest and for a back-up career.

- Choose a degree that doubles as an optional subject or a career: Political Science, History, Sociology, Geography, Economics, Law or Public Administration.
- Read one national newspaper daily from the first year and build the NCERT base in history, polity, geography and economics.
- Decide on a back-up profession by the second year; selection rates are a fraction of one per cent.

### Work-linked and short routes

A degree is not the only respectable start. Three routes combine study with earning.

- **Apprenticeship-embedded degrees and B.Voc programmes** place the student in industry for part of every year and pay a stipend.
- **One to two-year diplomas** in digital marketing, animation, photography, web development, culinary arts or medical technology lead to work quickly and can be topped up to a degree.
- **Distance and online degrees** from IGNOU and UGC-entitled universities let a student work, prepare for CA or a competitive exam, or train in sport or the arts alongside.

## 9. Cross-over and management careers

The stream decides the entry route; interest decides the industry. Every industry employs managers, analysts, communicators, lawyers and technologists who are not its core practitioners, so a commerce student drawn to medicine can run a hospital, a humanities student drawn to technology can shape how products are used, and a science student drawn to business can lead a company.

### 9.3 The MBA: a second chance to change field

An MBA or PGDM after graduation is open to every stream and is the commonest way to move into management of any industry.

- **Entry tests:** CAT for the IIMs and most leading schools; XAT, NMAT, SNAP and CMAT for others; GMAT for ISB and study abroad.
- **Eligibility:** a bachelor's degree in any subject, usually with 50% marks. The undergraduate subject does not limit the specialisation.
- **What helps:** consistent marks from Class 10 onward, two or three years of work experience, and evidence of interest in the chosen industry.
- **Sector MBAs** in hospital, pharma, agribusiness, rural, sports, media, energy and insurance management admit through the same tests or their own (Section 9.1).

### 10.4 Universities that admit through CUET UG

One CUET UG score opens admission to central universities and many state, deemed and private universities. The central universities most often chosen are Delhi University, JNU, BHU, Jamia Millia Islamia, AMU, University of Hyderabad, University of Allahabad, Pondicherry University, Visva-Bharati, Tezpur University, EFLU, NEHU, and the Central Universities of Rajasthan, Punjab, Haryana, Gujarat, Karnataka, Kerala, Tamil Nadu, South Bihar and Jharkhand. Register on each university's own admission portal as well as for CUET.

### 10.5 Six checks before trusting any college

1. **Recognition:** the university appears on the UGC list, and the course has its regulator's approval (AICTE, NMC, Bar Council, Pharmacy Council, Nursing Council, Council of Architecture or NCTE).
1. **Accreditation and rank:** NAAC grade, NBA accreditation for the branch, and NIRF position in its category.
1. **Outcomes:** median placement salary and the share of students placed, taken from the college's NIRF data sheet and not from its brochure.
1. **Faculty and facilities:** permanent faculty numbers, laboratories, library and hospital or industry attachment.
1. **True cost:** tuition, hostel, examination and other fees for the full course.
1. **A visit or a conversation:** speak to two current students or recent graduates before paying.

## 12. Applying to foreign universities

Applying abroad is a 12 to 18 month project with nine steps, and for entry in autumn 2027 the main deadlines are close: the UK's is 13 January 2027 and most US regular deadlines fall between 1 and 15 January 2027. A student who has not yet taken an English test or shortlisted universities should start this month or plan for a 2028 start.

### 12.1 The nine steps

1. **Decide why, what and where.** Fix the course first, then the country, then the budget and the plan after graduation.
1. **Shortlist 8 to 12 universities** across ambitious, realistic and safe. Read each one's page for Indian applicants: the Class 12 percentage, required subjects and tests.
1. **Take the tests.** An English test for almost every country; SAT or ACT for the United States; subject admission tests for some UK courses (Section 12.3).
1. **Gather documents.** Marksheets for Classes 9 to 12, predicted grades from the school, recommendation letters, essays or personal statement, activity record, portfolio where needed, and a valid passport.
1. **Apply through the right platform** for each country (Section 12.2) and pay the application fees.
1. **Apply for scholarships and financial aid** at the same time as admission; most aid deadlines match or precede the admission deadline.
1. **Compare offers.** Most are conditional on final board marks. Accept one by its reply date and pay the deposit.
1. **Arrange the money.** Get the education loan sanctioned and prepare proof of funds in the form the visa requires.
1. **Apply for the student visa,** book accommodation and insurance, and attend the pre-departure briefing.

### 12.6 Cautions

- **Rules are changing fast.** The United States, UK, Canada and Australia have all tightened student visa or post-study work rules since 2024. Read the government website in the week you apply.
- **Use only authorised agents.** Check the agent on the university's own list. No one can guarantee admission, a visa or a job.
- **Check recognition for regulated professions.** A foreign medical, law, pharmacy, nursing or architecture degree needs the Indian regulator's recognition and often a licensing exam before practice in India.
- **Count the full cost.** Add tuition increases, health insurance, flights, deposits and currency movement over three or four years.
- **Work rights are limited.** Part-time work during term is capped in every country and cannot be relied on to pay tuition.
- **Keep an Indian option alive.** Sit the Indian entrance exams and hold a seat until the visa is in hand.

## 13. Careers and artificial intelligence

A student entering college in 2027 will graduate into a job market where AI does much routine screen work, so the safest courses build judgement, human skill or technical depth on top of a degree. The World Economic Forum's [Future of Jobs Report 2025](https://www.weforum.org/publications/the-future-of-jobs-report-2025/digest/) projects 170 million jobs created and 92 million displaced worldwide by 2030. For India's technology services sector, [NITI Aayog](https://niti.gov.in/sites/default/files/2025-10/Roadmap_for_Job_Creation_in_the_AI_Economy.pdf) estimates anything from 1.5 million jobs lost to 4 million created by 2031, depending on reskilling.

### 13.1 How each stream's careers are affected

| Stream | Favoured: demand rising | Reshaped: job stays, tasks change | At risk: routine roles shrinking
| Science (PCM) | AI and machine learning, data science, cybersecurity, semiconductors, robotics, renewable energy and EV engineering | Software development, core engineering design, architecture | Junior testing and maintenance coding, basic drafting
| Science (PCB) | Bioinformatics, health data and medical AI, computational drug discovery; nursing and allied health stay in short supply | Radiology, pathology, pharmacy, clinical research | Medical transcription, basic lab data entry
| Commerce | Fintech, risk and quantitative analysis, forensic accounting, ESG and sustainability reporting | Audit, tax, banking, financial advice, marketing | Bookkeeping, payroll and accounts clerks, bank tellers, data entry
| Humanities | AI ethics and policy, technology law, UX research, psychology and counselling | Journalism, law, teaching, HR, translation | Routine content writing, basic translation, clerical and call-centre work
| All streams | Roles combining a domain with data and AI fluency | Almost every professional role | Any job made only of repetitive, rule-based screen tasks

Work is exposed when it is routine, screen-based and rule-governed. It is protected when it needs physical skill, human trust, legal accountability or original judgement.

### 13.2 What to do during college

1. Learn to use AI tools in your own subject and to check their output; treat this as a core skill in every course.
1. Add data skills: spreadsheets and statistics for everyone, a programming language where the course allows.
1. Do one internship or live project every year; employers hire evidence, not marksheets.
1. Build one human skill deliberately: writing, public speaking, negotiation, leadership or care.
1. Choose electives and a minor that cross fields, as Section 9 shows: commerce with health care, humanities with technology, science with business.

## 15. If plans change

Many students miss their first choice and still reach the career they wanted by a second route. Decide the back-up before results, when it can be chosen calmly.

### 15.1 When a target is missed

| What happened | Options this year | Option next year
| JEE rank too low for the preferred branch or institute | State CET and private university seats; B.Sc., BS-MS, BCA or mathematics and statistics degrees | Repeat JEE Main; JEE Advanced allows only two attempts in consecutive years
| NEET score below the MBBS cut-off | BDS, AYUSH, veterinary, nursing, allied health, pharmacy, biotechnology, hospital administration | Repeat NEET
| CLAT rank outside the leading NLUs | Newer NLUs, state law colleges, private law schools; B.A. or B.Com with 3-year LL.B. later | Repeat CLAT
| CUET score below the preferred college | Other colleges of the same university, other central and state universities, later counselling rounds | Repeat CUET
| IPMAT not cleared | BBA, B.Com or Economics now; MBA through CAT after graduation | Repeat IPMAT if within the age limit
| Board marks below an eligibility bar (for example 75%) | Supplementary or improvement exam where the board allows; courses without that bar | Improvement exam with next year's batch
| Visa refused or funds short for study abroad | Indian seat held as back-up; foreign university campuses in India | Reapply, or go abroad for a master's

### 15.2 Is a drop year right?

A drop year suits a student who meets all four conditions:

- The score this year was close to the target, not far from it.
- The cause of the shortfall is known and fixable: a weak subject, poor test practice, illness.
- The student, not only the parents, wants to repeat.
- A study plan, a mentor or coaching, and a mock-test schedule are in place from the first month.

If any condition is missing, joining a good course now is usually the better choice. Some students join a course and re-attempt the exam alongside.

### 15.3 A planned gap year

A gap year used for a defined purpose (an internship, a skill course, a language, sport, a family business, community work) is accepted by universities in India and abroad when it is explained. Keep certificates and a record of what was done. An unplanned year with nothing to show is harder to explain to a visa officer or an admissions panel.

### 15.4 Changing course after joining

- Many universities allow a change of major or a multidisciplinary minor after the first year.
- Credits earned are stored in the Academic Bank of Credits and can move with the student to another institution that accepts them.
- A master's degree, an MBA or a professional qualification can redirect a career after any bachelor's degree (Section 9).

### 15.5 Looking after the student

Result season is stressful, and a result is not a verdict on the person. Keep sleep, exercise and one non-study activity through the year, and talk early if worry becomes constant. Tele-MANAS, the Government of India's free mental health helpline, is available on 14416.

function parseDocket(src){
  const lines = src.replace(/\r/g,'').split('\n'); const chapters = []; let ch = null, i = 0, flag = null;
  const push = b => { if (ch) ch.blocks.push(b); };
  while (i < lines.length){
    const ln = lines[i]; let m;
    if (!ln.trim()){ i++; continue; }
    if ((m = /^## (\d+)\. (.+)$/.exec(ln))){ ch = {num:+m[1], title:m[2], blocks:[]}; chapters.push(ch); i++; continue; }
    if (ln.startsWith('### ')){ push({t:'h3', text:ln.slice(4)}); i++; continue; }
    if (ln[0]==='@'){ const d = ln.slice(1).trim(); if (d==='form'||d==='crossover') flag = d; else push({t:d}); i++; continue; }
    if (ln[0]==='|'){
      const rows = [];
      while (i < lines.length && lines[i][0]==='|'){
        const l = lines[i].trimEnd(); const mm = /^\|\*(\d+)/.exec(l);
        if (mm){ for (let k=0;k<+mm[1];k++) rows.push(null); }
        else { const cells = l.slice(1).split('|').map(s=>s.trim()); if (l.endsWith('|')) cells.pop(); rows.push(cells); }
        i++;
      }
      const head = rows.shift(), n = head.length;
      push({t:'table', head, rows:rows.map(r=>{ r = r||[]; while (r.length<n) r.push(''); return r; }), form:flag==='form', cross:flag==='crossover'});
      flag = null; continue;
    }
    if (/^- \[ \] /.test(ln)){ const items=[]; while (i<lines.length && /^- \[ \] /.test(lines[i])){ items.push(lines[i].slice(6)); i++; } push({t:'check', items}); continue; }
    if (ln.startsWith('- ')){ const items=[]; while (i<lines.length && lines[i].startsWith('- ') && !/^- \[ \] /.test(lines[i])){ items.push(lines[i].slice(2)); i++; } push({t:'ul', items}); continue; }
    if (/^1\. /.test(ln)){ const items=[]; while (i<lines.length && /^1\. /.test(lines[i])){ items.push(lines[i].slice(3)); i++; } push({t:'ol', items}); continue; }
    push({t:'p', text:ln}); i++;
  }
  return chapters;
}

function inline(s, dk){
  const plain = t => {
    t = esc(t).replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>');
    t = t.replace(/\b(?:[a-z0-9-]+\.)+(?:in|org|edu|com|ca|de|gov|au|uk)(?:\/[a-z0-9\/-]+)?(?![\w.])/g, x=>'<a href="https://'+x+'" target="_blank" rel="noopener">'+x+'</a>');
    if (dk){
      const lk = (n, label) => chapterOf(dk, +n) ? '<a href="#'+dk+'-'+n+'">'+label+'</a>' : label;
      t = t.replace(/\b(Sections?) (\d+)(\.\d+)?(?:( to | and )(\d+))?/g, (x,w,n,sub,j,n2)=> w+' '+lk(n, n+(sub||''))+(j ? j+lk(n2,n2) : ''));
    }
    return t;
  };
  let out = '', last = 0, m; const re = /\[([^\]]+)\]\((https?:[^)\s]+)\)/g;
  while ((m = re.exec(s))){ out += plain(s.slice(last, m.index)) + '<a href="'+esc(m[2])+'" target="_blank" rel="noopener">'+esc(m[1])+'</a>'; last = re.lastIndex; }
  return out + plain(s.slice(last));
}

let INDEX = null, lastQ = '', pendingFind = null;
function buildIndex(){
  INDEX = [];
  ['c10','c12'].forEach(dk => DATA[dk].forEach(ch => {
    const add = (text, bi, ri, title) => { text = stripMd(text); INDEX.push({dk, cn:ch.num, ct:ch.title, bi, ri, text, low:text.toLowerCase(), title:title||''}); };
    add(ch.title, -1, -1);
    ch.blocks.forEach((b,bi)=>{
      if (b.t==='p'||b.t==='h3') add(b.text, bi, -1);
      else if (b.items) b.items.forEach(x=>add(x, bi, -1));
      else if (b.t==='table') b.rows.forEach((r,ri)=>{ const t = r.filter(Boolean); if (t.length) add(t.join(' · '), bi, ri, stripMd(r[0])); });
    });
  }));
}
function hilite(text, toks){
  const low = text.toLowerCase(); let first = low.length; const marks = [];
  toks.forEach(t=>{ let p = low.indexOf(t); while (p>=0){ marks.push([p,p+t.length]); if (p<first) first = p; p = low.indexOf(t, p+t.length); } });
  let s = 0, e = text.length;
  if (text.length>200){ s = Math.max(0, first-70); e = Math.min(text.length, s+200); }
  marks.sort((a,b)=>a[0]-b[0]); let out = s>0 ? '… ' : '', pos = s;
  marks.forEach(([a,b])=>{ if (b<=pos||a>=e) return; a = Math.max(a,pos); b = Math.min(b,e); out += esc(text.slice(pos,a))+'<mark>'+esc(text.slice(a,b))+'</mark>'; pos = b; });
  return out + esc(text.slice(pos,e)) + (e<text.length ? ' …' : '');
}
function searchResults(q){
  const toks = q.toLowerCase().split(/\s+/).filter(t=>t.length>1);
  if (!toks.length) return '<p class="muted">Type a career, course, exam or institution. Both dockets are searched together.</p>';
  if (!INDEX) buildIndex();
  const hits = INDEX.filter(x=>toks.every(t=>x.low.includes(t)));
  if (!hits.length) return '<p class="muted">Nothing in either docket matches "'+esc(q)+'". Try one word, such as nursing, CLAT or scholarship.</p>';
  const shown = hits.slice(0,80), groups = [];
  shown.forEach(h=>{ let g = groups[groups.length-1]; if (!g || g.dk!==h.dk || g.cn!==h.cn){ g = {dk:h.dk, cn:h.cn, ct:h.ct, items:[]}; groups.push(g); } g.items.push(h); });
  return '<p class="small muted" role="status">'+hits.length+' match'+(hits.length===1?'':'es')+(hits.length>80?', first 80 shown':'')+'</p>'+groups.map(g=>'<div class="sgroup"><h2><span>'+DOCKETS[g.dk].short+'</span>'+g.cn+'. '+esc(g.ct)+'</h2>'+
    g.items.map(h=>'<a class="hit" href="#'+h.dk+'-'+h.cn+'" data-find="'+h.bi+':'+h.ri+'">'+(h.title && h.ri>=0 ? '<b>'+hilite(h.title, toks)+'</b>' : '')+'<span>'+hilite(h.title && h.ri>=0 ? h.text.slice(h.title.length).replace(/^ · /,'') || h.text : h.text, toks)+'</span></a>').join('')+'</div>').join('');
}

let cur = '';
const view = $('#view');
function parseRoute(h){
  const m = /^(c10|c12)(?:-(\d+))?$/.exec(h);
  if (m) return {v:'docket', dk:m[1], cn:m[2]?+m[2]:0, tab:m[1]};
  if (h==='test') return {v:'tests', tab:'test'};
  if (h==='test10'||h==='test12') return {v:'test', k:'t'+h.slice(4), tab:'test'};
  if (h==='search') return {v:'search', tab:'search'};
  return {v:'home', tab:'home'};
}
function go(h, replace){
  cur = h; try { history[replace?'replaceState':'pushState'](null, '', '#'+h); } catch(e){}
  render();
}
function render(keepScroll){
  clearInterval(timerId); timerId = 0;
  const r = parseRoute(cur);
  if (r.v==='test') useTest(r.k);
  view.innerHTML = r.v==='tests' ? viewTestChooser() : r.v==='docket' ? (r.cn ? viewChapter(r.dk, r.cn) : viewDocketCover(r.dk)) : r.v==='test' ? viewTest() : r.v==='search' ? viewSearch() : viewHome();
  $$('.tabs a').forEach(a=>{ if (a.dataset.tab===r.tab) a.setAttribute('aria-current','page'); else a.removeAttribute('aria-current'); });
  $$('textarea[data-f]', view).forEach(t=>{ if (forms[t.id]) t.value = forms[t.id]; grow(t); });
  if (r.v==='test'){ tNotice = ''; startTimer(); }
  if (keepScroll) return;
  const h1 = $('h1', view);
  if (pendingFind){
    const [bi, ri] = pendingFind; pendingFind = null;
    const el = (ri>=0 && $('#b'+bi+'r'+ri, view)) || $('#b'+bi, view);
    if (el){ el.scrollIntoView({block:'center'}); el.classList.add('flash'); return; }
  }
  window.scrollTo(0, 0);
  if (h1) try { h1.focus({preventScroll:true}); } catch(e){}
}
function grow(t){ t.style.height = 'auto'; if (t.scrollHeight) t.style.height = (t.scrollHeight+2)+'px'; }
function startTimer(){
  const el = $('#ttimer'); if (!el) return;
  const tick = () => {
    const left = Math.max(0, T.bEnd - Date.now()), m = Math.floor(left/60000), s = Math.floor(left%60000/1000);

}

function missing(kind){
  const [x,y] = pageRange(), out = [];

}
function flagMissing(kind, miss, word){

function tNext(){
  const q = quick(), s = T.stage;
  if (s==='details'){ T.stage = 'A'; T.page = 0; }
  else if (s==='A'){ const m = missing('a'); if (m.length){ flagMissing('a', m, m.length===1?'activity':'activitie'); return; } if (q||T.page===3){ T.stage = 'B'; T.page = 0; } else T.page++; }
  else if (s==='B'){
    if (!q && !T.bDone && !T.bEnd){ T.bEnd = Date.now() + 25*60*1000; T.page = 0; }
    else if (q||T.page===3){
      const blank = T.b.filter(v=>!v).length;
      if (!T.bDone && blank && !tWarned){ tWarned = true; const msg = $('#tmsg'); if (msg) msg.textContent = blank+' question'+(blank===1?' is':'s are')+' blank and will score zero. Press the button again to finish Part B anyway.'; return; }
      if (!q) T.bDone = true; T.stage = 'C'; T.page = 0;
    } else T.page++;
  }
  else if (s==='C'){ const m = missing('c'); if (m.length){ flagMissing('c', m, 'statement'); return; } if (q||T.page===1){ T.stage = 'values'; T.page = 0; } else T.page++; }
  else if (s==='values'){ const R = scoreTest(T, TD); if (!R.complete){ T.stage = R.aDone<48 ? 'A' : 'C'; T.page = 0; tNotice = 'Some items in Part '+T.stage+' are still blank.'; saveT(); render(); tNotice = ''; return; } T.stage = 'result'; }
  tWarned = false; saveT(); render();

function tBack(){
  const q = quick(), s = T.stage;

  else if (s==='B'){ if (q||T.page===0||(!T.bDone&&!T.bEnd)){ T.stage = 'A'; T.page = q?0:3; } else T.page--; }
  else if (s==='C'){ if (q||T.page===0){ T.stage = 'B'; T.page = q?0:3; } else T.page--; }

  tWarned = false; saveT(); render();
}

      const fallback = () => { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = filename; document.body.appendChild(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); }, 1500); resolve({status:'saved'}); };
      let file = null; try { file = new File([blob], filename, {type:'text/html'}); } catch(e){}
      if (file && navigator.canShare && navigator.canShare({files:[file]})) navigator.share({files:[file], title:filename}).then(()=>resolve({status:'saved'}), err => err && err.name==='AbortError' ? reject({code:'declined'}) : fallback());
      else fallback();
    } catch(e){ reject({code:'unavailable'}); }
  }) };
  document.documentElement.classList.add('can-dl');
} else {
  try { if (window.claude && window.claude.use) window.claude.use('downloads').then(d=>{ downloads = d; document.documentElement.classList.toggle('can-dl', !!d); }).catch(()=>{}); } catch(e){}
}

const ACTS = {
  tstart(b){ const d = T.d||{}; T = freshTest(); T.d = Object.assign({date:todayISO()}, d); T.mode = b.dataset.m; T.stage = 'details'; saveT(); render(); },
  tresume(){ if (T.stage==='intro') T.stage = 'details'; saveT(); render(); },
  tnew(){
    const box = $('#confirm');
    if (!box){ T = freshTest(); saveT(); render(); return; }
    box.innerHTML = '<div class="callout warn"><p>This clears every answer and the student details saved on this device.</p><span class="row"><button type="button" class="btn primary" data-act="tnewyes">Clear and start again</button><button type="button" class="btn" data-act="tnewno">Keep this result</button></span></div>';
  },
  tnewyes(){ T = freshTest(); saveT(); render(); },
  tnewno(){ const box = $('#confirm'); if (box) box.innerHTML = ''; },
  tedit(){ T.mode = 'quick'; T.stage = 'A'; T.page = 0; saveT(); render(); },
  tstage(b){ T.stage = b.dataset.s; T.page = 0; saveT(); render(); },
  tnext: tNext, tback: tBack,
  rank(b){ const i = +b.dataset.i, p = T.rank.indexOf(i); if (p>=0) T.rank.splice(p,1); else T.rank.push(i); saveT(); render(true); const el = $('#rank [data-i="'+i+'"]'); if (el) el.focus(); },
  copy(){
    const text = summaryText(scoreTest(T, TD)), msg = $('#rmsg');
    const fallback = () => { const box = $('#confirm'); if (!box) return; box.innerHTML = '<label class="field" for="cpy">Select and copy this summary<textarea id="cpy" readonly style="min-height:240px"></textarea></label>'; const ta = $('#cpy'); ta.value = text; ta.focus(); ta.select(); };
    try { navigator.clipboard.writeText(text).then(()=>{ if (msg) msg.textContent = 'Summary copied. Paste it into a message, email or document.'; }, fallback); } catch(e){ fallback(); }
  },
  download(){
    const msg = $('#rmsg'); if (!downloads) return;
    const name = (T.d.name||'student').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'') || 'student';
    downloads.save({filename:'career-profile-'+name+'.html', data:reportHTML(scoreTest(T, TD))}).then(
      ()=>{ if (msg) msg.textContent = 'Report saved. Open the file in a browser to print it.'; },
      err=>{ if (msg) msg.textContent = err && err.code==='declined' ? 'Download cancelled.' : err && err.code==='rate_limited' ? 'A download prompt is already open. Try again in a moment.' : 'This view cannot save files. Use Copy the summary instead.'; });
  },
  cross(b){ const g = b.dataset.g, wrap = b.parentElement; $$('.chip', wrap).forEach(c=>c.setAttribute('aria-pressed', c===b ? 'true' : 'false')); const tw = wrap.nextElementSibling; $$('tbody tr', tw).forEach(tr=>{ tr.hidden = !!g && tr.dataset.g!==g; }); },
  clearforms(b){
    const msg = $('#cfmsg');
    if (b.dataset.sure!=='1'){ b.dataset.sure = '1'; b.textContent = 'Press again to clear'; if (msg){ msg.style.color = 'var(--warn)'; msg.textContent = 'This removes everything typed in this section.'; } return; }
    const pre = 'f-'+b.dataset.dk+'-'+b.dataset.cn+'-'; Object.keys(forms).forEach(k=>{ if (k.startsWith(pre)) delete forms[k]; }); store.set('forms', forms);
    $$('textarea[data-f]', view).forEach(t=>{ t.value = ''; grow(t); }); b.dataset.sure = ''; b.textContent = 'Clear this section'; if (msg){ msg.style.color = ''; msg.textContent = 'Cleared.'; }
  },
  sug(b){ lastQ = b.dataset.q; const q = $('#q'); if (q) q.value = lastQ; $('#sres').innerHTML = searchResults(lastQ); }
};
document.addEventListener('click', e=>{
  const a = e.target.closest('a[href^="#"]');
  if (a){ e.preventDefault(); if (a.dataset.find){ const p = a.dataset.find.split(':'); pendingFind = [+p[0], +p[1]]; } go(a.getAttribute('href').slice(1)); return; }
  const b = e.target.closest('[data-act]'); if (b && ACTS[b.dataset.act]) ACTS[b.dataset.act](b);
});
let st = 0;
document.addEventListener('input', e=>{
  const t = e.target;
  if (t.matches('textarea[data-f]')){ if (t.value) forms[t.id] = t.value; else delete forms[t.id]; grow(t); clearTimeout(st); st = setTimeout(()=>store.set('forms', forms), 300); }
  else if (t.dataset.d){ T.d[t.dataset.d] = t.value; saveT(); }
  else if (t.dataset.t){ T[t.dataset.t] = t.value; saveT(); }
  else if (t.id==='q'){ lastQ = t.value; clearTimeout(st); st = setTimeout(()=>{ const r = $('#sres'); if (r) r.innerHTML = searchResults(lastQ); }, 160); }
});
document.addEventListener('change', e=>{
  const t = e.target; let m;
  if (t.matches('input[data-k]')){ if (t.checked) checks[t.id] = 1; else delete checks[t.id]; store.set('checks', checks); }
  else if (t.id==='chsel'){ go(t.dataset.dk+'-'+t.value); }
  else if (t.type==='radio' && (m = /^([abc])(\d+)$/.exec(t.name))){
    const k = m[1], i = +m[2]-1; T[k][i] = k==='b' ? t.value : +t.value; saveT(); updateProgress();
    const q = t.closest('.q'); if (q) q.classList.remove('miss');
  }
  else if (t.type==='radio' && (t.name==='years'||t.name==='move'||t.name==='budget')){ T[t.name] = t.value; saveT(); }
});
document.addEventListener('submit', e=>{ if (e.target.id==='sform'){ e.preventDefault(); lastQ = $('#q').value; $('#sres').innerHTML = searchResults(lastQ); } });
const fromHash = () => { let h = ''; try { h = (location.hash||'').slice(1); } catch(e){} if (h!==cur){ cur = h; render(); } };
window.addEventListener('popstate', fromHash); window.addEventListener('hashchange', fromHash);
try { if (window.claude && window.claude.hot && window.claude.hot.snapshot) window.claude.hot.snapshot(()=>({tests:testState, forms, checks, cur})); } catch(e){}
function boot(data){
  if (data && data.tests){ ['t10','t12'].forEach(k=>{ if (data.tests[k]) testState[k] = loadTest(data.tests[k]); }); T = testState[TD.key]; forms = data.forms||forms; checks = data.checks||checks; }
  try { cur = (data && data.cur) || (location.hash||'').slice(1); } catch(e){ cur = ''; }
  render();
}
try { if (window.claude && window.claude.hot && window.claude.hot.ready) window.claude.hot.ready(boot); else boot((window.claude && window.claude.hot && window.claude.hot.data) || {}); } catch(e){ boot({}); }

})();
if ('serviceWorker' in navigator && location.protocol !== 'file:') window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
</script>
